<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <!-- Sky / background -->
  <rect width="800" height="520" fill="#5c6b4f"/>
  <rect y="340" width="800" height="180" fill="#4a5640"/>

  <!-- Distant trees -->
  <ellipse cx="90" cy="300" rx="70" ry="90" fill="#3d4a36" opacity="0.55"/>
  <ellipse cx="710" cy="310" rx="80" ry="95" fill="#3d4a36" opacity="0.5"/>
  <ellipse cx="640" cy="320" rx="45" ry="60" fill="#4a5640" opacity="0.45"/>

  <!-- Ground / garden -->
  <path d="M0 420 Q200 400 400 415 T800 420 L800 520 L0 520 Z" fill="#3d2e28" opacity="0.35"/>
  <ellipse cx="180" cy="430" rx="55" ry="14" fill="#6b7d5a" opacity="0.35"/>
  <ellipse cx="620" cy="438" rx="48" ry="12" fill="#6b7d5a" opacity="0.3"/>
  <path d="M120 445 Q125 420 130 445" stroke="#7a8f68" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M680 442 Q685 418 690 442" stroke="#7a8f68" stroke-width="2" fill="none" opacity="0.5"/>

