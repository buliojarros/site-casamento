  <rect x="255" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="305" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="355" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="405" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="455" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="505" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="555" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>
  <rect x="581" y="260" width="14" height="160" fill="#f2ece4" stroke="#2c2420" stroke-width="1" opacity="0.9"/>

