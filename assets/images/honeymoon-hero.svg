  <path d="M355 320 Q400 295 445 320 L445 420 L355 420 Z" fill="#3d2e28"/>
  <path d="M355 320 Q400 295 445 320 L445 420 L355 420 Z" stroke="#b8956a" stroke-width="2" fill="none" opacity="0.75"/>
  <rect x="388" y="350" width="24" height="70" rx="12" fill="#b8956a" opacity="0.45"/>
  <circle cx="408" cy="385" r="3" fill="#e8e0d4"/>

