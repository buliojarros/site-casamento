  <rect x="355" y="225" width="90" height="45" fill="#c4b8a8" stroke="#2c2420" stroke-width="1.2"/>
  <line x1="400" y1="225" x2="400" y2="270" stroke="#2c2420" stroke-width="1"/>
  <rect x="350" y="268" width="100" height="6" fill="#b8956a" opacity="0.6"/>

