  <rect x="330" y="420" width="140" height="12" fill="#c4b8a8"/>
  <rect x="315" y="432" width="170" height="10" fill="#b8ab9a"/>
  <rect x="300" y="442" width="200" height="8" fill="#a89888"/>

  <!-- Wing windows -->
  <rect x="125" y="290" width="28" height="40" fill="#d9d0c2" stroke="#2c2420" stroke-width="1"/>
  <rect x="125" y="350" width="28" height="40" fill="#d9d0c2" stroke="#2c2420" stroke-width="1"/>
  <rect x="647" y="290" width="28" height="40" fill="#d9d0c2" stroke="#2c2420" stroke-width="1"/>
  <rect x="647" y="350" width="28" height="40" fill="#d9d0c2" stroke="#2c2420" stroke-width="1"/>

