  <path d="M230 230 Q245 210 260 230 L260 265 L230 265 Z" fill="#c4b8a8" stroke="#2c2420" stroke-width="1.2" opacity="0.85"/>
  <path d="M290 230 Q305 210 320 230 L320 265 L290 265 Z" fill="#c4b8a8" stroke="#2c2420" stroke-width="1.2" opacity="0.85"/>
