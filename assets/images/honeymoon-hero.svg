  <rect x="225" y="300" width="42" height="58" rx="2" fill="#d9d0c2" stroke="#2c2420" stroke-width="1.2"/>
  <line x1="246" y1="300" x2="246" y2="358" stroke="#2c2420" stroke-width="0.8" opacity="0.5"/>
  <rect x="285" y="300" width="42" height="58" rx="2" fill="#d9d0c2" stroke="#2c2420" stroke-width="1.2"/>
  <line x1="306" y1="300" x2="306" y2="358" stroke="#2c2420" stroke-width="0.8" opacity="0.5"/>
  <rect x="473" y="300" width="42" height="58" rx="2" fill="#d9d0c2" stroke="#2c2420" stroke-width="1.2"/>
  <line x1="494" y1="300" x2="494" y2="358" stroke="#2c2420" stroke-width="0.8" opacity="0.5"/>
  <rect x="533" y="300" width="42" height="58" rx="2" fill="#d9d0c2" stroke="#2c2420" stroke-width="1.2"/>
  <line x1="554" y1="300" x2="554" y2="358" stroke="#2c2420" stroke-width="0.8" opacity="0.5"/>

