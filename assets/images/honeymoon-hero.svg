  <rect x="515" y="128" width="38" height="10" fill="#2c2420" opacity="0.6"/>

  <!-- Subtle atmospheric overlay for hero text readability -->
  <rect width="800" height="520" fill="url(#heroFade)" opacity="0.18"/>

  <defs>
    <linearGradient id="heroFade" x1="400" y1="0" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2420" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#2c2420" stop-opacity="0"/>
      <stop offset="1" stop-color="#2c2420" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
</svg>
