  <rect x="110" y="250" width="70" height="170" stroke="#2c2420" stroke-width="1.5" fill="none" opacity="0.2"/>
  <rect x="620" y="250" width="70" height="170" fill="#ddd4c8"/>
  <rect x="620" y="250" width="70" height="170" stroke="#2c2420" stroke-width="1.5" fill="none" opacity="0.2"/>

