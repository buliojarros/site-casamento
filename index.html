<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatriz & Julio — Save the Date</title>
  <meta name="description" content="Save the date: Beatriz e Julio se casam em 12 de junho de 2027 em Campinas — SP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="save-the-date-page">
  <label class="save-the-date__grayscale-toggle">
    <input type="checkbox" id="grayscale-toggle" checked>
    <span>P&amp;B</span>
  </label>

  <main class="save-the-date">
    <section class="save-the-date__hero">
      <img
        class="save-the-date__image"
        src="assets/images/basilica-interior.jpg"
        alt="Interior da Basílica Nossa Senhora do Carmo"
      >
      <div class="save-the-date__overlay" aria-hidden="true"></div>

      <div class="save-the-date__content container">
        <p class="save-the-date__label">Save the Date</p>
        <h1 class="save-the-date__couple">
          <span class="save-the-date__couple-name">Beatriz</span>
          <span class="save-the-date__star" aria-hidden="true">⁕</span>
          <span class="save-the-date__couple-name">Julio</span>
        </h1>

        <div class="event-details save-the-date__details">
          <div class="event-details__col">
            12 Junho 2027<br>
            às 18:00
          </div>
          <div aria-hidden="true"></div>
          <div class="event-details__col event-details__col--right">
            Basílica Nossa Senhora do Carmo<br>
            Campinas — SP
          </div>
        </div>

        <p class="save-the-date__note">Convite completo em breve.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var toggle = document.getElementById('grayscale-toggle');
      var image = document.querySelector('.save-the-date__image');
      if (!toggle || !image) return;

      function updateGrayscale() {
        var isGrayscale = toggle.checked;
        image.classList.toggle('save-the-date__image--grayscale', isGrayscale);
        document.body.classList.toggle('save-the-date-page--grayscale', isGrayscale);
      }

      toggle.addEventListener('change', updateGrayscale);
      updateGrayscale();
    })();
  </script>
</body>
</html>
