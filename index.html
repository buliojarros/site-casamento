<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Beatriz & Julio — Save the Date</title>
  <meta name="description" content="Save the date: Beatriz e Julio se casam em 12 de junho de 2027 em Campinas — SP.">
  <link rel="icon" href="assets/images/monograma-gold.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=94">
</head>
<body class="save-the-date-page">
  <main class="save-the-date">
    <section class="save-the-date__hero">
      <img
        class="save-the-date__image"
        src="assets/images/save-the-date.png"
        alt="Save the Date — Beatriz e Julio, 12 de junho de 2027, Campinas, SP"
        width="472"
        height="1024"
      >
    </section>
  </main>

  <img
    class="save-the-date__kimi"
    src="assets/images/dog-dark.png"
    alt=""
    aria-hidden="true"
    hidden
  >

  <script>
    (function () {
      var image = document.querySelector(".save-the-date__image");
      var kimi = document.querySelector(".save-the-date__kimi");
      if (!image || !kimi) return;

      var kimiWidth = 64;

      function updateKimi() {
        var imageWidth = image.getBoundingClientRect().width;
        var kimiSize = kimi.getBoundingClientRect().width || kimiWidth;
        kimi.hidden = window.innerWidth <= imageWidth + 8 * kimiSize;
      }

      function watchKimi() {
        updateKimi();
        if ("ResizeObserver" in window) {
          var observer = new ResizeObserver(updateKimi);
          observer.observe(image);
          observer.observe(kimi);
        } else {
          window.addEventListener("resize", updateKimi);
        }
      }

      if (image.complete) {
        watchKimi();
      } else {
        image.addEventListener("load", watchKimi);
      }
    })();
  </script>
</body>
</html>
